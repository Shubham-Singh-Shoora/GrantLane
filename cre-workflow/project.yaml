# ==========================================================================
# CRE PROJECT SETTINGS
# ==========================================================================
# Keyed by target. `cre workflow <cmd> --target <name>` selects one.
# RPC URLs support ${VAR} syntax, resolved from cre-workflow/.env or the shell,
# which keeps credentialled endpoints out of this committed file.
# ==========================================================================

staging-settings:
  rpcs:
    # Settlement chain: GrantEscrow lives here and the workflow writes its
    # report here.
    - chain-name: arc-testnet
      url: https://rpc.testnet.arc.io
    # Workflow Registry chain — where the workflow itself is registered.
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com

# ==========================================================================
production-settings:
  rpcs:
    - chain-name: arc-testnet
      url: https://rpc.testnet.arc.io
    - chain-name: ethereum-testnet-sepolia
      url: https://ethereum-sepolia-rpc.publicnode.com
