# Reviewer rubric, encrypted by the CRE CLI before upload:
#   cre secrets create --target staging-settings
#
# The rubric is fetched INSIDE the Nitro enclave via runtime.getSecret() and
# never leaves it. Each line of the secret's value is one criterion; the text
# before the colon is the keyword the scorer looks for in the evidence bundle.
#
# Copy to secrets.yaml (gitignored) and set the value in cre-workflow/.env.
secretsNames:
  GRANT_REVIEW_RUBRIC:
    - GRANT_REVIEW_RUBRIC
