# Reviewer rubric, encrypted by the CRE CLI before upload:
#   cre secrets create --file secrets.yaml --target staging-settings
#
# The rubric is fetched INSIDE the Nitro enclave and never leaves it. Each line
# is one criterion; the text before the colon is the keyword the scorer looks
# for in the evidence bundle.
secretsNames:
  GRANT_REVIEW_RUBRIC:
    - GRANT_REVIEW_RUBRIC
